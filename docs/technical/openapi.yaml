      summary: Báo cáo đối soát tổng hợp và chênh lệch phiên quầy tiền mặt
      operationId: getCashSessionSummary
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tổng hợp thu chi tiền mặt, ngân hàng, cọc và chênh lệch ca trực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashSessionSummaryDto'
        '404':
          description: Không tìm thấy phiên quầy

  /finance/bookstore-lots/{id}/settle:
    post:
      tags: [Finance]
      summary: Quyết toán đợt bán sách mới (Hoàn cọc 1M riêng, thanh toán 3.9M riêng)
      operationId: settleBookstoreLot
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [soldQuantity, returnedQuantity, depositRefundReceived, settlementPaymentPaid]
              properties:
                soldQuantity:
                  type: integer
                  example: 60
                returnedQuantity:
                  type: integer
                  example: 40
                depositRefundReceived:
                  type: integer
                  example: 1000000
                settlementPaymentPaid:
                  type: integer
                  example: 3900000
      responses:
        '200':
          description: Quyết toán đợt bán thành công, ghi 2 bút toán độc lập

  /finance/refunds/{intentId}/confirm:
    post:
      tags: [Finance]
      summary: "Xác nhận thực hoàn trả tiền cọc cho bạn đọc (Chặng 08: Ghi nhận ca chi thực)"
      operationId: confirmRefundIntent
      security:
        - BearerAuth: []
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Khóa chống trùng lặp chi tiền hoàn cọc
      responses:
        '200':
          description: Xác nhận hoàn cọc thành công, tiền thực đã xuất khỏi quỹ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ConfirmRefundResponseDto'
                  message:
                    type: string
        '400':
          description: Thiếu X-Idempotency-Key hoặc dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực danh tính
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền thao tác (chỉ Active Member hoặc Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy ý định hoàn cọc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ý định đã được xác nhận trước đó hoặc số dư tiền mặt tại quầy không đủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /finance/ledger/corrections:
    post:
      tags: [Finance]
      summary: "Sửa sai chứng từ sổ kép qua bút toán đảo (Chặng 11: Correction / Reversal)"
      description: |
        Tạo bút toán đảo (Reversal Entry) đối ứng Nợ - Có cho một bút toán đã ghi sổ trước đó.
        Bảo đảm tính bất biến của sổ cái: không sửa hay xóa dòng cũ, liên kết chặt chẽ qua reversal_of_entry_id.
      operationId: createDocumentCorrection
      security:
        - BearerAuth: []
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Khóa chống trùng lặp sửa sai chứng từ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originalEntryId, reason]
              properties:
                originalEntryId:
                  type: string
                  format: uuid
                  description: ID của bút toán gốc cần đảo
                reason:
                  type: string
                  minLength: 5
                  example: "Nhập nhầm phương thức thanh toán chuyển khoản thành tiền mặt"
                cashSessionId:
                  type: string
                  description: ID phiên quầy chịu ảnh hưởng nếu có tiền mặt
                actionId:
                  type: string
                  description: Mã hành động kiểm toán
      responses:
        '200':
          description: Thực hiện bút toán đảo thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DocumentCorrectionResultDto'
                  message:
                    type: string
        '400':
          description: Thiếu dữ liệu hoặc số dư tiền mặt không đủ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Quyền truy cập bị từ chối
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy bút toán gốc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Bút toán đã bị đảo trước đó hoặc có xung đột phụ thuộc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

