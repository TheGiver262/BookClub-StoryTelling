openapi: 3.1.0
info:
  title: YSBK Management System API
  description: |
    API Contract chuẩn hóa cho Website Quản Lý CLB Yêu Sách Bách Khoa Hà Nội (YSBK).
    Bao gồm 26 operations cho các luồng nghiệp vụ lõi (Lưu thông sách, Thành viên, Trực ban, Tuyển thành viên, Quỹ & Bán sách, Cảm nhận, Báo cáo và Nhật ký).
    Các endpoints Sự kiện (FR-06), Báo mất sách (Chặng 11) và Lịch sử sửa điểm (Chặng 17) là dự kiến và chưa có handler trong phiên bản này.
    Kiểm soát quyền nghiêm ngặt theo ma trận Khách, Thành viên hoạt động, Cựu thành viên và Quản trị viên.
  version: 1.0.0
  contact:
    name: Ban Công Nghệ & Quản Trị Hệ Thống YSBK
    email: clbyeusachbachkhoahanoi@gmail.com

servers:
  - url: /api/v1
    description: API cùng origin với frontend beta
  - url: https://api.ysbk.edu.vn/api/v1
    description: Tên miền minh họa trong thiết kế cũ, chưa phải endpoint được triển khai
  - url: http://localhost:8787/api/v1
    description: Local Development & PoC Testing Server

paths:
  # =====================================================================
  # 1. AUTHENTICATION & IDENTITY (FR-09)
  # =====================================================================
  /auth/login-internal:
    post:
      tags: [Auth]
      summary: Đăng nhập thành viên nội bộ hoặc cựu thành viên bằng username riêng
      operationId: loginInternal
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: "anh.haucan"
                password:
                  type: string
                  format: password
                  example: "MatKhauBaoMat123@"
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT phiên nội bộ và đặt cookie HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Dữ liệu yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sai tên đăng nhập hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login-guest:
    post:
      tags: [Auth]
      summary: Đăng nhập bạn đọc / khách bằng Google OAuth hoặc Email
      operationId: loginGuest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [google, email]
                  example: "google"
                email:
                  type: string
                  format: email
                  example: "reader@gmail.com"
                password:
                  type: string
                  format: password
                token:
                  type: string
                  description: Google OAuth ID Token
      responses:
        '200':
          description: Đăng nhập thành công, trả về JWT có claim GUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Thiếu thông tin xác thực bắt buộc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Xác thực thất bại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Lấy thông tin phiên làm việc hiện tại của actor
      operationId: getCurrentActor
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Thông tin actor hiện tại
        '401':
          description: Chưa xác thực hoặc phiên đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất và vô hiệu hóa phiên làm việc
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Đăng xuất thành công, cookie phiên bị xóa và token bị thu hồi

  # =====================================================================
  # 2. CATALOG & INVENTORY (FR-01)
  # =====================================================================
  /catalog/books:
    get:
      tags: [Catalog]
      summary: Tra cứu danh mục sách công khai (Hỗ trợ tìm kiếm tiếng Việt không dấu)
      operationId: listPublicBooks
      security: []
      parameters:
        - name: query
          in: query
          description: Từ khóa tìm kiếm (tên sách, tác giả)
          schema:
            type: string
        - name: category
          in: query
          description: Lọc theo thể loại
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách đầu sách kèm số lượng bản sách sẵn sàng
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookTitleDto'
                  total:
                    type: integer

  /catalog/books/{id}:
    get:
      tags: [Catalog]
      summary: Xem chi tiết đầu sách, ấn bản và trạng thái các bản sách vật lý
      operationId: getBookDetail
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Thông tin chi tiết sách và vị trí bản vật lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailDto'
        '404':
          description: Không tìm thấy đầu sách

  /catalog/books/titles:
    post:
      tags: [Catalog]
      summary: Tạo đầu sách mới (Nội bộ Thành viên/Quản trị viên)
      operationId: createBookTitle
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  example: "Giải Tích 1"
                originalTitle:
                  type: [string, "null"]
                  example: "Calculus I"
                description:
                  type: [string, "null"]
                  example: "Giáo trình Toán cao cấp dành cho sinh viên kỹ thuật"
                authors:
                  type: array
                  items:
                    type: string
                  example: ["Nguyễn Đình Trí"]
                categories:
                  type: array
                  items:
                    type: string
                  example: ["Toán học", "Giáo trình"]
      responses:
        '201':
          description: Tạo đầu sách thành công
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BookTitleDto'
                  message:
                    type: string
        '400':
          description: Dữ liệu đầu sách không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thao tác (chỉ Thành viên hoặc Admin)

  /catalog/books/{titleId}/editions:
    post:
      tags: [Catalog]
      summary: Tạo ấn bản sách mới (Nội bộ Thành viên/Quản trị viên)
      operationId: createBookEdition
      security:
        - BearerAuth: []
      parameters:
        - name: titleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publisher:
                  type: [string, "null"]
                  example: "NXB Bách Khoa"
                publishYear:
                  type: [integer, "null"]
                  example: 2023
                isbn:
                  type: [string, "null"]
                  example: "978-604-0-12345-6"
                coverPrice:
                  type: [integer, "null"]
                  description: Giá bìa niêm yết (0đ cho phép; NULL nếu không ghi nhận)
                  example: 74000
      responses:
        '201':
          description: Tạo ấn bản thành công
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      titleId:
                        type: string
                        format: uuid
                      publisher:
                        type: [string, "null"]
                      publishYear:
                        type: [integer, "null"]
                      isbn:
                        type: [string, "null"]
                      coverPrice:
                        type: [integer, "null"]
                      calculatedDeposit:
                        type: integer
                  message:
                    type: string
        '400':
          description: Dữ liệu ấn bản không hợp lệ
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thao tác
        '404':
          description: Không tìm thấy đầu sách

  /catalog/books/copies:
    post:
      tags: [Catalog]
      summary: Thêm mới bản sách vật lý (Nội bộ bàn trực)
      operationId: createBookCopy
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [editionId, barcode]
              properties:
                editionId:
                  type: string
                  format: uuid
                barcode:
                  type: string
                  example: "BK-CALC-01"
                location:
                  type: string
                  enum: [KHO_THU_VIEN, KHO_HOI_SINH_VIEN, BAN_TRUC_TAM]
                  default: KHO_THU_VIEN
                coverPrice:
                  type: [integer, "null"]
                  example: 74000
                conditionNote:
                  type: [string, "null"]
      responses:
        '201':
          description: Thêm bản sách thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyDto'
        '400':
          description: Dữ liệu không hợp lệ
        '403':
          description: Quyền truy cập bị từ chối
        '409':
          description: Trùng lặp barcode

  /catalog/books/copies/{id}:
    patch:
      tags: [Catalog]
      summary: Cập nhật metadata bản sách vật lý (Không cho phép đổi status mượn trả)
      operationId: updateBookCopy
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                location:
                  type: string
                  enum: [KHO_THU_VIEN, KHO_HOI_SINH_VIEN, BAN_TRUC_TAM]
                coverPrice:
                  type: [integer, "null"]
                conditionNote:
                  type: [string, "null"]
      responses:
        '200':
          description: Cập nhật bản sách thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyDto'
        '400':
          description: Dữ liệu không hợp lệ hoặc cố tình đổi status mượn trả
        '404':
          description: Không tìm thấy bản sách

  /catalog/books/copies/{id}/archive:
    post:
      tags: [Catalog]
      summary: Lưu trữ bản sách vật lý (Không cho phép lưu trữ sách đang mượn)
      operationId: archiveBookCopy
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lưu trữ bản sách thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyDto'
        '400':
          description: Sách đang được mượn hoặc đã lưu trữ trước đó
        '404':
          description: Không tìm thấy bản sách

  /catalog/books/copies/barcode/{barcode}:
    get:
      tags: [Catalog]
      summary: Tra cứu chi tiết bản sách vật lý theo barcode (Nội bộ bàn trực)
      operationId: getBookCopyByBarcode
      security:
        - BearerAuth: []
      parameters:
        - name: barcode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Thông tin chi tiết bản sách và mức cọc tính toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyDto'
        '404':
          description: Không tìm thấy bản sách với barcode này

  # =====================================================================
  # 2b. COMMUNITY BORROWERS (FR-01)
  # =====================================================================
  /borrowers:
    get:
      tags: [Borrowers]
      summary: Tìm kiếm danh sách người mượn (Chỉ Thành viên và Quản trị viên)
      operationId: searchBorrowers
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          description: Từ khóa tìm kiếm (SĐT, MSSV, Họ tên)
          schema:
            type: string
        - name: includeArchived
          in: query
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách người mượn
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BorrowerDto'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '403':
          description: Khách hoặc cựu thành viên bị cấm xem danh sách người mượn

    post:
      tags: [Borrowers]
      summary: Tạo mới hồ sơ người mượn cộng đồng (Không ép MSSV đối với người dân)
      operationId: createBorrower
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone]
              properties:
                fullName:
                  type: string
                  example: "Nguyễn Văn Dân"
                phone:
                  type: string
                  example: "0912345678"
                studentId:
                  type: [string, "null"]
                  example: null
                school:
                  type: [string, "null"]
                  example: null
                email:
                  type: [string, "null"]
                  example: null
                notes:
                  type: [string, "null"]
                  example: "Người dân phường Bách Khoa"
      responses:
        '201':
          description: Tạo hồ sơ người mượn thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowerDto'
        '400':
          description: Thông tin không hợp lệ
        '403':
          description: Quyền truy cập bị từ chối

  /borrowers/{id}:
    get:
      tags: [Borrowers]
      summary: Xem chi tiết hồ sơ người mượn theo ID (Nội bộ)
      operationId: getBorrowerById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chi tiết hồ sơ người mượn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowerDto'
        '404':
          description: Không tìm thấy hồ sơ người mượn

    patch:
      tags: [Borrowers]
      summary: Cập nhật thông tin người mượn
      operationId: updateBorrower
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phone:
                  type: string
                studentId:
                  type: [string, "null"]
                school:
                  type: [string, "null"]
                email:
                  type: [string, "null"]
                notes:
                  type: [string, "null"]
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowerDto'
        '400':
          description: Dữ liệu không hợp lệ hoặc hồ sơ đã lưu trữ
        '404':
          description: Không tìm thấy hồ sơ người mượn

  /borrowers/{id}/archive:
    post:
      tags: [Borrowers]
      summary: Lưu trữ hồ sơ người mượn (Không cho phép lưu trữ khi có sách chưa trả)
      operationId: archiveBorrower
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lưu trữ hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowerDto'
        '400':
          description: Người mượn đang có sách mượn chưa trả hoặc đã lưu trữ trước đó
        '404':
          description: Không tìm thấy hồ sơ người mượn

  # =====================================================================
  # 3. CIRCULATION & DESK LOANS (FR-01)
  # =====================================================================
  /circulation/loans:
    get:
      tags: [Circulation]
      summary: Danh sách phiếu mượn bàn trực (Nội bộ)
      operationId: listLoans
      security:
        - BearerAuth: []
      parameters:
        - name: borrowerId
          in: query
          description: Lọc theo ID người mượn
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Lọc theo trạng thái phiếu mượn
          schema:
            type: string
            enum: [ACTIVE, OVERDUE, RETURNED, PARTIAL_SETTLED]
        - name: page
          in: query
          description: Trang hiện tại (mặc định 1)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Số bản ghi mỗi trang (mặc định 20)
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách phiếu mượn và thông tin phân trang
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoanReceiptDto'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền truy cập (chỉ Thành viên hoặc Admin)

    post:
      tags: [Circulation]
      summary: Lập phiếu mượn mới tại bàn trực (Tối đa 2 cuốn/phiếu, khóa dòng bản sách chống deadlock)
      operationId: createLoanReceipt
      security:
        - BearerAuth: []
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: true
          description: Khóa chống gửi trùng lặp request giao dịch (tối đa 128 ký tự)
          schema:
            type: string
            example: "idemp-loan-20261019-001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [borrowerId, paymentConfirmed]
              properties:
                borrowerId:
                  type: string
                  format: uuid
                  example: "00000000-0000-0000-0000-000000000001"
                barcodes:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: string
                  example: ["BK-00101", "BK-00201"]
                copyBarcodes:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: string
                  description: Alias tương thích ngược cho barcodes
                  example: ["BK-00101", "BK-00201"]
                paymentMethod:
                  type: string
                  enum: [CASH, BANK_TRANSFER, TIEN_MAT, CHUYEN_KHOAN]
                  default: CASH
                  example: "CASH"
                paymentConfirmed:
                  type: boolean
                  description: Xác nhận thủ thư/trực ban đã nhận đủ tiền cọc thực tế (Bắt buộc true)
                  example: true
                bankConfirmedByMember:
                  type: boolean
                  description: Alias tương thích ngược cho paymentConfirmed
                  example: true
      responses:
        '201':
          description: Lập phiếu thành công, ghi nhận cọc, bút toán sổ cái và biên nhận
          headers:
            Cache-Control:
              schema:
                type: string
                example: "no-store"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoanReceiptDto'
                  message:
                    type: string
        '400':
          description: Dữ liệu yêu cầu không hợp lệ (thiếu thông tin, số lượng sách sai, cọc chưa xác nhận)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực
        '403':
          description: Không có quyền thao tác (chỉ Thành viên hoặc Admin)
        '409':
          description: Xung đột tài nguyên - Bản sách đang được mượn, bạn đọc quá hạn, phiên quầy đã đóng hoặc lỗi idempotency
          content:
