      summary: "Báo mất sách và tịch thu tiền cọc (Chặng 11: Lost Book)"
      description: |
        Đánh dấu một hoặc nhiều cuốn sách trên phiếu mượn là LOST, tịch thu tiền cọc tương ứng và ghi nhận vào sổ cái (Nợ COC_PHAI_HOAN / Có THU_PHAT).
        Quy tắc cọc: Mất sách mất cọc, chỉ giữ đúng số tiền cọc đã nhận, không thu thêm theo giá bìa hay tăng quỹ tiền mặt.
      operationId: reportBookLoss
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID của phiếu mượn
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Khóa chống trùng lặp báo mất sách
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                copyIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Danh sách ID bản sách báo mất
                barcodes:
                  type: array
                  items:
                    type: string
                  description: Danh sách mã vạch bản sách báo mất
                reason:
                  type: string
                  minLength: 3
                  example: "Bạn đọc làm rơi mất sách trên xe buýt"
                cashSessionId:
                  type: string
                  description: ID phiên quầy liên kết
                notes:
                  type: string
      responses:
        '200':
          description: Báo mất sách thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReportBookLossResultDto'
                  message:
                    type: string
        '400':
          description: Thiếu thông tin hoặc selector không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền thao tác
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy phiếu mượn hoặc bản sách
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sách đã trả/mất trước đó hoặc phiếu đã tất toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

