    get:
      tags: [Content]
      summary: Danh sách cảm nhận sách đã duyệt (APPROVED) công khai, không chứa PII (P22-12)
      operationId: getPublicReviews
      security: []
      parameters:
        - name: bookId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Danh sách cảm nhận đã kiểm duyệt
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookReviewPublicDto'

  /public/books/{id}/reviews:
    get:
      tags: [Content]
      summary: Danh sách cảm nhận sách đã duyệt của một đầu sách cụ thể (P22-12)
      operationId: getBookReviews
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Danh sách cảm nhận đã duyệt của sách
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookReviewPublicDto'

  /moderation/reviews:
    get:
      tags: [Content Moderation]
      summary: Danh sách bài cảm nhận cần kiểm duyệt (cho thành viên nội bộ)
      operationId: listReviewsForModeration
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
      responses:
        '200':
          description: Danh sách bài review
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookReviewModerationDto'

  /moderation/reviews/{id}/decision:
    post:
      tags: [Content Moderation]
      summary: Duyệt hoặc từ chối bài cảm nhận sách
      operationId: moderateReviewDecision
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVE, REJECT]
                notes:
                  type: string
      responses:
        '200':
          description: Cập nhật trạng thái duyệt thành công

  /public/posts:
    get:
      tags: [Content]
      summary: Danh sách bài viết tin tức / thông báo công khai
      operationId: listPublicPosts
      security: []
      responses:
        '200':
          description: Danh sách bài viết
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicPostItemDto'
        '400':
          description: Yêu cầu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/reservation-books:
    get:
      tags: [Reservations]
      summary: Danh mục sách có thể đặt giữ chỗ công khai
      operationId: listPublicReservationBooks
      security: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Tên thể loại chính xác
        - name: includeUnavailable
          in: query
          schema:
            type: boolean
            default: false
          description: Hiển thị toàn bộ đầu sách, kể cả chưa có bản khả dụng; trả thêm meta.categories để dựng bộ lọc. Không thay đổi điều kiện tạo giữ chỗ.
        - name: onlyAvailable
          in: query
          schema:
            type: boolean
            default: false
          description: Khi xem toàn bộ danh mục, chỉ lấy các đầu sách còn ít nhất một bản có thể giữ chỗ.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách sách và số lượng bản khả dụng, meta.total/page/limit; meta.categories có khi includeUnavailable=true. Trang tra cứu dùng limit=50. Đầu sách chưa có bản khả dụng có availableCopiesCount=0, không được tạo giữ chỗ.
        '400':
          description: Tham số không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/pickup-schedules:
    get:
      tags: [Reservations]
      summary: Danh sách ca trực còn nhận giữ chỗ
      operationId: listPublicPickupSchedules
      security: []
      responses:
        '200':
          description: Danh sách ca trực khả dụng
        '400':
          description: Lỗi truy vấn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/reservations:
    post:
      tags: [Reservations]
      summary: Đặt giữ chỗ sách công khai (1 quyển/đơn, không đăng nhập, xác minh CAPTCHA)
      operationId: createPublicReservation
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Đặt giữ chỗ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReservationDto'
        '200':
          description: Trả lại kết quả đơn đã tạo (Replay idempotency)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReservationDto'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Hết sách khả dụng hoặc xung đột payload idempotency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Vượt quá hạn mức 3 suất/SĐT hoặc 3 đơn/IP/24h
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/reservation:
    get:
      tags: [Reservations]
      summary: Tra cứu chi tiết một đơn đặt bằng token riêng
      operationId: getPublicReservation
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Chi tiết đơn đặt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicReservationDto'
        '401':
          description: Thiếu token hoặc token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy đơn đặt hoặc token không khớp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /public/reservation/cancel:
    post:
      tags: [Reservations]
      summary: Hủy đơn giữ chỗ bằng token riêng của đơn
      operationId: cancelPublicReservation
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Hủy đơn thành công, giải phóng bản sách và suất SĐT
        '401':
          description: Không có quyền truy cập đơn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy đơn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Đơn không ở trạng thái HELD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservations:
    get:
      tags: [Reservations]
      summary: Danh sách đơn đặt chờ nhận tại quầy (dành cho thành viên trực)
      operationId: listStaffReservations
      security:
        - BearerAuth: []
      parameters:
        - name: scheduleId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Danh sách nội bộ có fullName, phone, fulfillmentIssue (COPY_UNAVAILABLE hoặc null); meta.attentionCount là tổng cảnh báo trong bộ lọc. Ưu tiên cảnh báo trước, Cache-Control no-store.
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không đủ quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservations/{id}/issue:
    post:
      tags: [Reservations]
      summary: Báo bản sách đã giữ không thể giao, chuyển MAINTENANCE và ghi audit; không hủy đơn
      operationId: reportStaffReservationIssue
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Đã báo hoặc bản đã ở MAINTENANCE; đơn vẫn HELD, không gửi email/SMS
        '400':
          description: Lý do trống hoặc quá dài
        '401':
          description: Chưa đăng nhập
        '403':
          description: Không phải thành viên nội bộ đang hoạt động
        '404':
          description: Không tìm thấy đơn
        '409':
          description: Đơn không còn HELD có hiệu lực hoặc trạng thái bản sách không cho phép thao tác

  /reservations/{id}/fulfill:
    post:
      tags: [Reservations]
      summary: Bàn giao sách và thu cọc tại bàn trực, chuyển thành phiếu mượn 1 cuốn
      operationId: fulfillStaffReservation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulfillReservationRequest'
      responses:
        '200':
          description: Bàn giao thành công và tạo phiếu mượn
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không đủ quyền giao sách
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy đơn hoặc bản sách
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Đơn đã hết hạn, đã hủy hoặc đã giao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reservations/{id}/cancel:
    post:
      tags: [Reservations]
      summary: Thành viên trực hủy đơn trước khi nhận
      operationId: cancelStaffReservation
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Hủy đơn thành công
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không đủ quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy đơn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Đơn đã giao hoặc không ở trạng thái HELD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        role:
          type: string
          enum: [ADMIN, ACTIVE_MEMBER, ALUMNI, GUEST]
        username:
          type: string

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          example: "CONCURRENT_CONFLICT"
        message:
          type: string
          example: "Bản sách đã được mượn bởi người khác."
        timestamp:
          type: string

    BookTitleDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        authors:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        coverPrice:
          type: [integer, "null"]
        calculatedDeposit:
          type: integer
        availableCopiesCount:
          type: integer

    BookDetailDto:
      allOf:
        - $ref: '#/components/schemas/BookTitleDto'
        - type: object
          properties:
            publisher:
              type: string
            publishYear:
              type: integer
            description:
              type: string
            copies:
              type: array
              items:
                type: object
                properties:
                  barcode:
                    type: string
                  location:
                    type: string
                  status:
                    type: string

    LoanReceiptDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        receiptNumber:
          type: string
        borrowerName:
          type: string
        borrowerStudentId:
          type: string
        borrowDate:
          type: string
        dueDate:
          type: string
        renewCount:
          type: integer
        status:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              barcode:
                type: string
              bookTitle:
                type: string
              depositSnapshot:
                type: integer

    ReturnSettlementResponseDto:
      type: object
      properties:
        receiptId:
          type: string
          format: uuid
        receiptNumber:
          type: string
        status:
          type: string
          enum: [ACTIVE, RETURNED, OVERDUE, PARTIAL_SETTLED, CANCELLED]
        returnDate:
          type: string
          example: "2026-10-19"
        overdueDays:
          type: integer
        fineSuggested:
          type: integer
        fineFinal:
          type: integer
        fineReason:
          type: [string, "null"]
        totalDeposit:
          type: integer
        depositRefunded:
          type: integer
        depositForfeited:
          type: integer
        directFineCollected:
          type: integer
        depositTransferred:
          type: integer
          description: "Số tiền cọc của cuốn giữ lại được chuyển sang phiếu mới (cash-neutral)"
        newDepositCollected:
          type: integer
          description: "Số tiền cọc mới thực thu cho cuốn giữ lại (trường hợp T73: P >= D)"
        newReceiptId:
          type: [string, "null"]
          format: uuid
          description: "ID phiếu mượn mới sinh tự động khi trả 1 phần (PARTIAL)"
        newReceiptNumber:
          type: [string, "null"]
          description: "Mã số phiếu mượn mới"
        successorReceiptId:
          type: [string, "null"]
          format: uuid
        finePending:
          type: integer
          description: "Số tiền phạt còn chờ thu sau"
        refundIntents:
          type: array
          items:
            $ref: '#/components/schemas/RefundIntentSummaryDto'
        returnedItemsCount:
          type: integer
        message:
          type: string

    RefundIntentSummaryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        allocationId:
          type: string
          format: uuid
        amount:
          type: integer
        refundMethod:
          type: string
          enum: [CASH, BANK_TRANSFER]
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED]
        cashSessionId:
          type: [string, "null"]

    ConfirmRefundResponseDto:
      type: object
      properties:
        refundIntentId:
          type: string
          format: uuid
        allocationId:
          type: string
          format: uuid
        amount:
          type: integer
        refundMethod:
          type: string
          enum: [CASH, BANK_TRANSFER]
        status:
          type: string
          example: "CONFIRMED"
        confirmedBy:
          type: string
          format: uuid
        confirmedAt:
          type: string
          format: date-time
        cashSessionId:
          type: string
        journalEntryId:
          type: string
          format: uuid
        message:
          type: string

    LoanSettlementDetailDto:
      type: object
      properties:
        settlementId:
          type: [string, "null"]
          format: uuid
        settlementType:
          type: [string, "null"]
          enum: [FULL, PARTIAL]
        receiptId:
          type: string
          format: uuid
        receiptNumber:
          type: string
        status:
          type: string
        borrowDate:
          type: string
        dueDate:
          type: string
        returnDate:
          type: string
        overdueDays:
          type: integer
        suggestedFine:
          type: integer
        fineSuggested:
          type: integer
        fineFinal:
          type: [integer, "null"]
        fineReason:
          type: [string, "null"]
        fineCollected:
          type: integer
        finePendingAmount:
          type: integer
        fineStatus:
          type: [string, "null"]
          enum: [COLLECTED, PENDING, WAIVED]
        finePaymentMethod:
          type: [string, "null"]
        totalDeposit:
          type: integer
        depositRefunded:
          type: integer
        depositForfeited:
          type: integer
        depositTransferred:
          type: integer
        newDepositCollected:
          type: integer
        successorReceiptId:
          type: [string, "null"]
          format: uuid
        settledAt:
          type: [string, "null"]
          format: date-time
        settledBy:
          type: [string, "null"]
          format: uuid
        items:
          type: array
          items:
            type: object
            properties:
              copyId:
                type: string
                format: uuid
              barcode:
                type: string
              title:
                type: string
              depositSnapshot:
                type: integer
              returnedAt:
                type: [string, "null"]
        allocations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              amount:
                type: integer
              status:
                type: string
        refundIntents:
          type: array
          items:
            $ref: '#/components/schemas/RefundIntentSummaryDto'

    RenewLoanResultDto:
      type: object
      properties:
        receiptId:
          type: string
          format: uuid
        receiptNumber:
          type: string
        renewalSequence:
          type: integer
        previousDueDate:
          type: string
          format: date
        newDueDate:
          type: string
          format: date
        originalNewDueDate:
          type: string
          format: date
        adjustmentReason:
          type: [string, "null"]
        renewCount:
          type: integer
        isOverdue:
          type: boolean
        overdueDays:
          type: integer
        fineSuggested:
          type: integer
        fineFinal:
          type: integer
        fineCollected:
          type: boolean
        finePending:
          type: boolean
        fineStatus:
          type: string
          enum: [COLLECTED, PENDING, WAIVED]
        renewedAt:
          type: string
          format: date-time
        renewedBy:
          type: string
          format: uuid
        message:
          type: string

    LoanRenewalItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        receiptId:
          type: string
          format: uuid
        renewalSequence:
          type: integer
        renewedAt:
          type: string
          format: date-time
        renewedBy:
          type: string
          format: uuid
        previousDueDate:
          type: string
          format: date
        newDueDate:
          type: string
          format: date
        originalNewDueDate:
          type: string
          format: date
        adjustmentReason:
          type: [string, "null"]
        isOverdue:
          type: boolean
        overdueDays:
          type: integer
        fineSuggested:
          type: integer
        fineFinal:
          type: integer
        fineReason:
          type: [string, "null"]
        fineCollected:
          type: integer
        finePendingAmount:
          type: integer
        fineStatus:
          type: string
          enum: [COLLECTED, PENDING, WAIVED]
        finePaymentMethod:
          type: [string, "null"]
        cashSessionId:
          type: [string, "null"]
        notes:
          type: [string, "null"]

    ConfirmNewDepositResultDto:
      type: object
      properties:
        receiptId:
          type: string
          format: uuid
        receiptNumber:
          type: string
        status:
          type: string
        depositAmount:
          type: integer
        paymentMethod:
          type: string
          enum: [CASH, BANK_TRANSFER]
        cashSessionId:
          type: [string, "null"]
        journalEntryId:
          type: string
          format: uuid
        message:
          type: string

    CollectPendingFineResultDto:
      type: object
      properties:
        receiptId:
          type: string
          format: uuid
        settlementId:
          type: string
          format: uuid
        fineCollected:
          type: integer
        paymentMethod:
          type: string
          enum: [CASH, BANK_TRANSFER]
        fineStatus:
          type: string
          enum: [COLLECTED]
