  /circulation/loans/{id}/settle-return:
    post:
      tags: [Circulation]
      summary: "Xử lý tất toán trả sách (Chặng 08: Trả toàn bộ, tính phạt và tạo ý định hoàn cọc)"
      operationId: settleReturnReceipt
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Khóa chống trùng lặp giao dịch tài chính/tất toán
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                returnType:
                  type: string
                  enum: [FULL, PARTIAL]
                  default: FULL
                  description: "Chế độ tất toán: FULL (trả hết) hoặc PARTIAL (trả 1 cuốn, giữ 1 cuốn và chuyển tiếp)"
                returnedCopyIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Danh sách ID các bản sách thực tế hoàn trả
                returnedCopyBarcodes:
                  type: array
                  items:
                    type: string
                  description: Danh sách mã vạch các bản sách thực tế hoàn trả
                paymentConfirmed:
                  type: boolean
                  description: "Bắt buộc true: Xác nhận đã thực nhận tiền mặt hoặc giao dịch tài chính trước khi chốt"
                refundMethod:
                  type: string
                  enum: [CASH, BANK_TRANSFER]
                  default: CASH
                  description: Phương thức dự kiến hoàn cọc cho bạn đọc
                fineAmount:
                  type: integer
                  description: Mức phạt chốt sau điều chỉnh/miễn/giảm (mặc định bằng mức phạt gợi ý)
                fineReason:
                  type: string
                  description: Bắt buộc nếu mức phạt chốt khác mức phạt gợi ý do hệ thống tính
                finePaymentMethod:
                  type: string
                  enum: [CASH, BANK_TRANSFER]
                  description: "Phương thức thanh toán tiền phạt trực tiếp (độc lập với refundMethod)"
                finePaymentConfirmed:
                  type: boolean
                  description: "Xác nhận đã thực thu tiền phạt (nếu false/chưa thu: không rollback nhận sách)"
                newDepositPaymentMethod:
                  type: string
                  enum: [CASH, BANK_TRANSFER]
                  description: "Phương thức thu cọc mới cho cuốn giữ lại (trường hợp T73: P >= D)"
                newDepositConfirmed:
                  type: boolean
                  description: "Xác nhận đã thực thu cọc mới (trường hợp T73: nếu false phiếu mới ở trạng thái PENDING_DEPOSIT)"
      responses:
        '200':
          description: Tất toán thành công, hoàn cọc và thu phạt riêng biệt
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ReturnSettlementResponseDto'
                  message:
                    type: string
        '400':
          description: Dữ liệu yêu cầu không hợp lệ hoặc thiếu lý do điều chỉnh phạt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa xác thực danh tính
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền thao tác (chỉ Active Member hoặc Admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Không tìm thấy phiếu mượn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Xung đột nghiệp vụ (phiếu đã trả, sai lệch cọc, hoặc ca quầy đã đóng)
          content:
            application/json:
              schema:
